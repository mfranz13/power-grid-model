<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; background: #fbfbfa; }
    a { color: #4f46e5; } a:hover { color: #6d28d9; }
    text { font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', monospace; }
  </style>
</helmet>
<svg viewBox="0 0 1280 760" width="1280" height="760" xmlns="http://www.w3.org/2000/svg" style="display: block">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"></stop>
      <stop offset="0.55" stop-color="#f9f9f7"></stop>
      <stop offset="1" stop-color="#f2f2f0"></stop>
    </linearGradient>
    <linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"></stop>
      <stop offset="1" stop-color="#f5f5fa"></stop>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="760" fill="url(#bg)"></rect>

  <text x="40" y="58" font-size="26" font-weight="600" fill="#111827">AC-Netz mit Phasenschiebertransformator</text>
  <text x="40" y="86" font-size="14" fill="#6b7280">Zwei synchron gekoppelte 110-kV-Netzteile, Leistungsfluss auf der 20-kV-Ebene über einen Phasenschiebertransformator (PST) gesteuert</text>

  <!-- ===================== Insel A ===================== -->
  <rect x="228" y="116" width="44" height="44" fill="none" stroke="#1f2937" stroke-width="1.75"></rect>
  <line x1="228" y1="149" x2="261" y2="116" stroke="#1f2937" stroke-width="1.25"></line>
  <line x1="228" y1="160" x2="272" y2="116" stroke="#1f2937" stroke-width="1.25"></line>
  <line x1="239" y1="160" x2="272" y2="127" stroke="#1f2937" stroke-width="1.25"></line>
  <text x="284" y="134" font-size="13" font-weight="600" fill="#1f2937">Slack A</text>
  <text x="284" y="152" font-size="12" fill="#6b7280">u_ref 1,0 pu</text>
  <line x1="250" y1="160" x2="250" y2="196" stroke="#1f2937" stroke-width="1.75"></line>
  <line x1="160" y1="196" x2="340" y2="196" stroke="#1f2937" stroke-width="5"></line>
  <text x="150" y="200" font-size="13" font-weight="600" text-anchor="end" fill="#1f2937">Knoten 1 · 110 kV</text>
  <line x1="250" y1="196" x2="250" y2="223" stroke="#1f2937" stroke-width="1.75"></line>
  <circle cx="250" cy="246" r="23" fill="none" stroke="#1f2937" stroke-width="1.75"></circle>
  <circle cx="250" cy="280" r="23" fill="none" stroke="#1f2937" stroke-width="1.75"></circle>
  <text x="292" y="258" font-size="13" font-weight="600" fill="#1f2937">Trafo 21</text>
  <text x="292" y="275" font-size="12" fill="#6b7280">25 MVA 110/20 kV · YNd5</text>
  <line x1="250" y1="303" x2="250" y2="344" stroke="#1f2937" stroke-width="1.75"></line>
  <line x1="160" y1="344" x2="340" y2="344" stroke="#1f2937" stroke-width="5"></line>
  <text x="150" y="336" font-size="13" font-weight="600" text-anchor="end" fill="#1f2937">Knoten 3 · 20 kV</text>
  <line x1="210" y1="344" x2="210" y2="560" stroke="#1f2937" stroke-width="1.75"></line>
  <text x="198" y="436" font-size="13" font-weight="600" text-anchor="end" fill="#1f2937">Leitung 31</text>
  <text x="198" y="453" font-size="12" fill="#6b7280" text-anchor="end">NA2XS2Y 1x240 RM/25</text>
  <text x="198" y="470" font-size="12" fill="#6b7280" text-anchor="end">5 km · 421 A</text>
  <line x1="120" y1="560" x2="300" y2="560" stroke="#1f2937" stroke-width="5"></line>
  <text x="110" y="564" font-size="13" font-weight="600" text-anchor="end" fill="#1f2937">Knoten 5 · 20 kV</text>
  <line x1="210" y1="560" x2="210" y2="612" stroke="#1f2937" stroke-width="1.75"></line>
  <path d="M 202 612 L 218 612 L 210 628 Z" fill="#1f2937"></path>
  <text x="228" y="610" font-size="13" font-weight="600" fill="#1f2937">Last</text>
  <text x="228" y="627" font-size="12" fill="#6b7280">800 kW · 200 kvar</text>

  <!-- ===================== Insel B ===================== -->
  <rect x="1008" y="116" width="44" height="44" fill="none" stroke="#1f2937" stroke-width="1.75"></rect>
  <line x1="1008" y1="149" x2="1041" y2="116" stroke="#1f2937" stroke-width="1.25"></line>
  <line x1="1008" y1="160" x2="1052" y2="116" stroke="#1f2937" stroke-width="1.25"></line>
  <line x1="1019" y1="160" x2="1052" y2="127" stroke="#1f2937" stroke-width="1.25"></line>
  <text x="996" y="134" font-size="13" font-weight="600" text-anchor="end" fill="#1f2937">Slack B</text>
  <text x="996" y="152" font-size="12" fill="#6b7280" text-anchor="end">u_ref 1,0 pu</text>
  <line x1="1030" y1="160" x2="1030" y2="196" stroke="#1f2937" stroke-width="1.75"></line>
  <line x1="940" y1="196" x2="1120" y2="196" stroke="#1f2937" stroke-width="5"></line>
  <text x="1130" y="200" font-size="13" font-weight="600" fill="#1f2937">Knoten 2 · 110 kV</text>
  <line x1="1030" y1="196" x2="1030" y2="223" stroke="#1f2937" stroke-width="1.75"></line>
  <circle cx="1030" cy="246" r="23" fill="none" stroke="#1f2937" stroke-width="1.75"></circle>
  <circle cx="1030" cy="280" r="23" fill="none" stroke="#1f2937" stroke-width="1.75"></circle>
  <text x="988" y="258" font-size="13" font-weight="600" text-anchor="end" fill="#1f2937">Trafo 22</text>
  <text x="988" y="275" font-size="12" fill="#6b7280" text-anchor="end">25 MVA 110/20 kV · YNd5</text>
  <line x1="1030" y1="303" x2="1030" y2="344" stroke="#1f2937" stroke-width="1.75"></line>
  <line x1="940" y1="344" x2="1120" y2="344" stroke="#1f2937" stroke-width="5"></line>
  <text x="1130" y="336" font-size="13" font-weight="600" fill="#1f2937">Knoten 4 · 20 kV</text>
  <line x1="1070" y1="344" x2="1070" y2="560" stroke="#1f2937" stroke-width="1.75"></line>
  <text x="1082" y="436" font-size="13" font-weight="600" fill="#1f2937">Leitung 32</text>
  <text x="1082" y="453" font-size="12" fill="#6b7280">NA2XS2Y 1x240 RM/25</text>
  <text x="1082" y="470" font-size="12" fill="#6b7280">5 km · 421 A</text>
  <line x1="980" y1="560" x2="1160" y2="560" stroke="#1f2937" stroke-width="5"></line>
  <text x="1170" y="564" font-size="13" font-weight="600" fill="#1f2937">Knoten 6 · 20 kV</text>
  <line x1="1070" y1="560" x2="1070" y2="600" stroke="#1f2937" stroke-width="1.75"></line>
  <circle cx="1070" cy="626" r="26" fill="none" stroke="#1f2937" stroke-width="1.75"></circle>
  <text x="1070" y="623" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2937">G</text>
  <path d="M 1060 632 q 5 -7 10 0 q 5 7 10 0" fill="none" stroke="#1f2937" stroke-width="1.5"></path>
  <text x="1108" y="622" font-size="13" font-weight="600" fill="#1f2937">Erzeugung</text>
  <text x="1108" y="639" font-size="12" fill="#6b7280">500 kW</text>

  <!-- ===================== PST 80 (generic_branch, Knoten 3 - Knoten 4) ===================== -->
  <line x1="340" y1="344" x2="572" y2="344" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"></line>
  <circle cx="340" cy="344" r="3" fill="#1f2937"></circle>
  <circle cx="608" cy="344" r="36" fill="none" stroke="#1f2937" stroke-width="1.75"></circle>
  <circle cx="672" cy="344" r="36" fill="none" stroke="#1f2937" stroke-width="1.75"></circle>
  <line x1="640" y1="344" x2="640" y2="316" stroke="#9ca3af" stroke-width="1.25" stroke-dasharray="2 3"></line>
  <line x1="640" y1="344" x2="657" y2="322" stroke="#4f46e5" stroke-width="1.75"></line>
  <path d="M 649.5 316.5 L 657 322 L 648 324.5 Z" fill="#4f46e5"></path>
  <path d="M 640 328 A 16 16 0 0 1 651 320" fill="none" stroke="#4f46e5" stroke-width="1.5"></path>
  <text x="666" y="316" font-size="13" font-weight="600" fill="#4f46e5">θ</text>
  <text x="640" y="298" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">PST 80 (generic_branch)</text>
  <text x="640" y="404" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">k = 1, θ variabel, 10 MVA, uk 10 %</text>
  <line x1="708" y1="344" x2="940" y2="344" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"></line>
  <circle cx="940" cy="344" r="3" fill="#1f2937"></circle>

  <!-- Regelungs-Karte: einzige gesteuerte Groesse des PST -->
  <line x1="640" y1="380" x2="640" y2="424" stroke="#0d9488" stroke-width="1" stroke-dasharray="3 4" opacity="0.6"></line>
  <rect x="490" y="424" width="300" height="80" rx="10" fill="url(#cardg)" stroke="#e5e7eb" stroke-width="1"></rect>
  <text x="504" y="448" font-size="12" font-weight="600" fill="#1f2937">PST 80 · Regelung</text>
  <text x="774" y="448" font-size="9.5" text-anchor="end" fill="#0d9488" letter-spacing="1">VORGABE</text>
  <rect x="504" y="460" width="272" height="26" rx="8" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488" stroke-opacity="0.45" stroke-width="1"></rect>
  <text x="513" y="477" font-size="11.5" fill="#0f766e">θ-Kanal: θ = variabel · Betriebspunkte −0,36° und +0,56°</text>

  <!-- Maschen-Hinweis: warum der PST-Fluss nicht durch Last und Erzeugung begrenzt ist -->
  <rect x="40" y="646" width="1200" height="42" rx="10" fill="#4f46e5" fill-opacity="0.05" stroke="#4f46e5" stroke-opacity="0.25" stroke-width="1"></rect>
  <text x="56" y="663" font-size="11.5" fill="#3730a3">Der PST liegt in einer Masche: Slack A — Trafo 21 — PST — Trafo 22 — Slack B, geschlossen über das 110-kV-Netz. Sein Winkel steuert einen Transitfluss,</text>
  <text x="56" y="679" font-size="11.5" fill="#3730a3">der nur von der Maschenimpedanz abhängt und daher nicht durch Last (800 kW) und Erzeugung (500 kW) begrenzt ist. Leitung 31 und 32 bleiben unverändert.</text>

  <!-- Legende -->
  <line x1="40" y1="712" x2="90" y2="712" stroke="#1f2937" stroke-width="1.75"></line>
  <text x="100" y="716" font-size="12" fill="#6b7280">AC</text>
  <rect x="150" y="700" width="82" height="24" rx="8" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488" stroke-opacity="0.45" stroke-width="1"></rect>
  <text x="162" y="716" font-size="11.5" fill="#0f766e">Vorgabe</text>
  <text x="256" y="716" font-size="12" fill="#111827" class="mono">123,4 kW</text>
  <text x="330" y="716" font-size="12" fill="#6b7280">= Ergebnis (berechnet, siehe Szenario-Tafeln)</text>
  <text x="1240" y="716" font-size="12" fill="#6b7280" text-anchor="end" class="mono">P ≈ U² · sin(δ−θ) / X  →  dP/dθ ≈ −0,88 MW/°</text>
</svg>
</x-dc>
</body>
</html>
